server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # O service worker NUNCA pode ser cacheado: `location =` (match exato) tem precedência
    # sobre o regex de estáticos abaixo, senão o SW ficaria 30 dias congelado no aparelho.
    location = /sw.js {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        expires -1;
    }

    # Nginx não conhece o MIME do manifest por padrão. Um `types {}` no nível `server`
    # SUBSTITUI (não estende) o mapa `mime.types` herdado do bloco `http` — todo o resto
    # (index.html, .js, .css...) cairia em `default_type application/octet-stream`, e o
    # browser passaria a BAIXAR index.html e recusar os módulos JS. Por isso o MIME do
    # manifest é declarado só aqui, no próprio location, com `types {}` vazio + `default_type`
    # escopados a esta location — o mapa global do bloco `server`/`http` fica intocado.
    location = /manifest.webmanifest {
        types { }
        default_type application/manifest+json;
        add_header Cache-Control "no-cache";
        expires -1;
    }

    # SPA: todas as rotas caem no index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # API é servida separadamente (proxy/ALB em prod); aqui só o estático.
    location ~* \.(js|css|png|jpg|jpeg|svg|woff2?)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }
}
