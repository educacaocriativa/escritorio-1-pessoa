# CI — testa a imagem Docker de PRODUÇÃO, o isolamento cross-tenant (RLS),
# e faz secret scan (gitleaks) + SAST do frontend (semgrep).
# Story 3.2: pega o drift venv↔produção (a suíte roda DENTRO da imagem, não só no venv)
# e garante o isolamento RLS num Postgres real (testcontainers).
# Story 6.2: adiciona `secret-scan` (gitleaks) e `sast-semgrep` como gates de segurança.
#
# Gate obrigatório: se qualquer job falhar, o workflow fica vermelho — e isso BLOQUEIA o
# merge. Os CINCO jobs deste arquivo são required checks em `main`, conjunto verificado em
# 2026-08-18: `test-in-prod-image`, `cross-tenant-rls`, `secret-scan`, `sast-semgrep` e
# `frontend`. Push direto em `main` é rejeitado (GH006); toda mudança passa por PR.
# Para reconferir o conjunto SEM ser admin do repositório, a receita está no CLAUDE.md §5.1 —
# a rota óbvia (`/branches/main/protection`) responde 404 para quem não é admin, e esse 404 é
# indistinguível de "branch não protegida": não o leia como resposta.
#
# O PADRÃO desta casa — gates OBSERVÁVEIS primeiro, bloqueantes depois — está CONCLUÍDO para
# estes cinco, e foi assim que os cinco chegaram a required: um gate novo entra rodando e
# aparecendo no PR (check vermelho quando acha algo) mas FORA da lista de required; roda um
# período de observação; e só é promovido a bloqueante depois de se mostrar sem falso positivo
# excessivo — assim ninguém trava merge por falso positivo no dia 1. Gate novo daqui pra frente
# nasce assim (é o caso do job de mutação noturna, issue #121).
#
# NÃO usamos `continue-on-error` para obter a fase observável: ele deixaria o check sempre
# verde e tornaria a promoção via branch protection um no-op. O mecanismo de "não-bloqueante"
# é a AUSÊNCIA do check na lista de required — nunca `continue-on-error`.
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # AC1: builda a imagem de produção e roda ruff + a suíte completa DENTRO dela.
  # Mesmo tipo de drift que já quebrou uma vez (FastAPI do venv > pinado em requirements.txt).
  test-in-prod-image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Contexto de build = apps/api (mesmo padrão de infra/docker-compose.prod.yml: build ../apps/api).
      # O Dockerfile faz `COPY . .`, incluindo apps/api/tests/ (não excluído pelo .dockerignore),
      # então a suíte viaja dentro da imagem de produção.
      - name: Build imagem de produção
        run: docker build -f apps/api/Dockerfile -t e1p-api:ci apps/api

      # ruff + pytest DENTRO da imagem. SQLite em memória (conftest.py) — sem Postgres real.
      # O marker rls_e2e é excluído aqui (o teste de isolamento precisa subir um Postgres via
      # testcontainers e roda no job cross-tenant-rls, direto no runner — sem Docker-in-Docker).
      - name: Lint + testes na imagem de produção
        run: docker run --rm e1p-api:ci sh -c "ruff check . && python -m pytest -q -m 'not rls_e2e'"

  # AC2: isolamento cross-tenant no Postgres REAL (testcontainers). Roda direto no runner
  # (Docker nativo no ubuntu-latest), não aninhado na imagem de produção — evita Docker-in-Docker.
  cross-tenant-rls:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Instalar dependências
        run: pip install -r apps/api/requirements.txt

      # Gate do Caddyfile (issue #151) — mora AQUI, e não no `test-in-prod-image`, porque aquele
      # job roda a suíte DENTRO da imagem da API, onde só `apps/api` foi copiado: `infra/` não
      # existe lá e o gate se auto-pula (na primeira versão ele nem se pulava — estourava
      # `IndexError` num `parents[3]` fixo e derrubava a COLETA inteira). Este job tem o checkout
      # completo e é required em `main`.
      #
      # A guarda abaixo reprova o SKIP, mesma lógica do `rls_e2e` logo abaixo: um gate que se pula
      # sozinho fica verde sem proteger nada, e o silêncio é indistinguível de aprovação.
      - name: Gates de infra/ (Caddyfile e a guarda do deploy.sh)
        run: |
          set -uo pipefail
          cd apps/api
          python -m pytest -q tests/test_caddyfile_blocos_opcionais.py tests/test_deploy_guarda_checkout_limpo.py --junitxml=infra-gates.xml
          rc=$?
          if [ "$rc" -ne 0 ] && [ "$rc" -ne 5 ]; then exit "$rc"; fi
          python -c 'import sys,xml.etree.ElementTree as ET; r=ET.parse("infra-gates.xml").getroot(); s=r if r.tag=="testsuite" else r.find("testsuite"); t=int(s.get("tests",0)); k=int(s.get("skipped",0)); ex=t-k; print(f"infra-gates: coletados={t} executados={ex} skipped={k}"); ok=ex>=11; ok or print("::error::Um gate de infra/ foi PULADO ou sumiu (esperado >= 11 executados: 7 do Caddyfile + 4 da guarda do deploy.sh). Eles dependem de infra/, bash e git alcancaveis; pulado, nao protege nada -- o do Caddyfile e a issue #151, o do deploy.sh e a guarda que abortava 100% dos deploys na AWS."); sys.exit(0 if ok else 1)'

      # AMPLIADO (Story 7.1): filtra por PROPRIEDADE (o marker rls_e2e), NÃO por um arquivo nomeado.
      # Assim os 9 arquivos test_*_rls.py de hoje — e um 10º futuro — entram automaticamente, sem
      # reeditar este ci.yml (mesma lógica do canário anti-regressão da Story 6.1). Sobe
      # postgres:16-alpine por teste, roda as migrations como o papel NÃO-superusuário e1p_app
      # (Regra de Ouro nº 1) e valida "João não vê dados da Maria".
      #
      # FALHA-DURA anti-skip-silencioso (Story 7.1): um caminho infeliz de RLS que NÃO roda é pior
      # que um que falha visivelmente. O exit code do pytest sozinho não é garantia suficiente —
      # cada arquivo rls_e2e abre com `pytest.importorskip("testcontainers.postgres")`; se o
      # testcontainers sumir (drift em requirements.txt, pip falho) os testes viram SKIPPED e o CI
      # poderia ficar VERDE com ZERO cobertura de RLS real (falso senso de segurança). Por isso,
      # além de rodar o pytest, lemos o --junitxml e EXIGIMOS que >=1 teste rls_e2e tenha REALMENTE
      # executado (coletado E não-skipped): 0 executados FALHA o job de propósito. Um teste que
      # FALHOU (exit != 0 e != 5) também derruba o job (a guarda não mascara falha real).
      # Validado localmente (Docker, 2026-07-11): normal→verde; sem testcontainers→9 skipped/exit5→
      # vermelho; 0 coletados→vermelho. @devops: com esta garantia mais forte, promover
      # `cross-tenant-rls` a required em branch protection passa a apoiar-se em cobertura real, não
      # apenas na ausência de falha (ver cabeçalho + Task 5 da Story 6.2).
      - name: Teste de isolamento RLS (Postgres real — toda a suíte rls_e2e)
        run: |
          set -uo pipefail
          cd apps/api
          python -m pytest -q -m rls_e2e --junitxml=rls-results.xml
          rc=$?
          # rc: 0=passaram · 1=algum FALHOU · 5=nenhum rodou/coletado · outros=erro de coleta/uso.
          # Falha real (rc != 0 e != 5) derruba já aqui; rc=5 e rc=0 seguem p/ a guarda de execução.
          if [ "$rc" -ne 0 ] && [ "$rc" -ne 5 ]; then exit "$rc"; fi
          python -c 'import sys,xml.etree.ElementTree as ET; r=ET.parse("rls-results.xml").getroot(); s=r if r.tag=="testsuite" else r.find("testsuite"); t=int(s.get("tests",0)); k=int(s.get("skipped",0)); ex=t-k; print(f"rls_e2e: coletados={t} executados={ex} skipped={k}"); ok=ex>=9; ok or print("::error::Nenhum teste rls_e2e executou (todos SKIPPED ou zero coletados). RLS real nao foi exercido — falhando o CI em vez de passar em silencio (Story 7.1)."); sys.exit(0 if ok else 1)'

  # Story 6.2 / AC1: secret scan com gitleaks (OSS, MIT — custo zero, Regra de Ouro nº 4).
  # Usamos o CLI gitleaks via container pinado por DIGEST (supply-chain), NÃO a
  # gitleaks-action: desde a v2.0.0 a Action deixou de ser MIT e passou a um EULA
  # PROPRIETÁRIO da Gitleaks LLC (LICENSE.txt do próprio repo da Action; a API do GitHub
  # devolve `Other`/NOASSERTION). É source-available, não open source: o EULA vincula pelo
  # simples uso e proíbe modificar/derivar. O CLI/binário gitleaks continua MIT, sem EULA
  # (mesma engine, cobertura de detecção idêntica — a Action só embrulha o binário):
  # custo zero de verdade + zero fricção legal (Regra de Ouro nº 4).
  # O motivo NÃO é a chave: o `GITLEAKS_LICENSE` só é exigido para repos de conta de
  # ORGANIZAÇÃO, e este repo é de conta de USUÁRIO — `gh api repos/educacaocriativa/
  # escritorio-1-pessoa --jq .owner.type` → "User" (conferido em 2026-08-18). Aqui a Action
  # rodaria sem chave e sem registro; o que pesa é a licença do wrapper (issue #131).
  # O padrão `docker run` é o mesmo já usado por `test-in-prod-image` neste arquivo.
  # Required check em `main` (verificado em 2026-08-18) — chegou lá pela promoção do cabeçalho.
  secret-scan:
    runs-on: ubuntu-latest
    steps:
      # fetch-depth: 0 → gitleaks precisa do histórico p/ escanear o range de commits
      # (o diff do PR e os commits do push), não só o snapshot do último commit.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # gitleaks v8.30.1 pinado por digest. Em PR, escaneia SÓ o range base..head
      # (o "diff do PR" — AC1); em push para main, varre o histórico visível (a allowlist
      # de .gitleaks.toml calibra o ruído). `git` = subcomando de scan de repositório;
      # ENTRYPOINT da imagem já é `gitleaks`, então passamos só os args a partir de `git`.
      - name: Secret scan (gitleaks)
        env:
          GITLEAKS_IMAGE: ghcr.io/gitleaks/gitleaks@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            echo "gitleaks: escaneando o range do PR ${BASE_SHA}..${HEAD_SHA}"
            docker run --rm -v "$PWD:/repo" -w /repo "$GITLEAKS_IMAGE" \
              git --config .gitleaks.toml --redact --verbose \
              --log-opts="${BASE_SHA}..${HEAD_SHA}"
          else
            echo "gitleaks: varredura completa do histórico (push para main)"
            docker run --rm -v "$PWD:/repo" -w /repo "$GITLEAKS_IMAGE" \
              git --config .gitleaks.toml --redact --verbose
          fi

  # Story 6.2 / AC2: SAST do frontend (TS/JS/React + OWASP) com semgrep (OSS — custo zero).
  # Container semgrep/semgrep pinado por DIGEST. Packs públicos curados do Semgrep Registry
  # (p/typescript, p/react, p/owasp-top-ten) — não o pack genérico p/ci (mais ruidoso).
  # Escaneia SÓ apps/web (TS/React): o backend Python já é coberto por `ruff` no job
  # test-in-prod-image; SAST Python (p/python) fica como follow-up, não é escopo do AC2.
  # Required check em `main` (verificado em 2026-08-18) — ver o cabeçalho.
  sast-semgrep:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # `semgrep scan` com --error → exit 1 se houver achado (check vermelho = observável).
      # --metrics=off: nenhum dado sai para a Semgrep (privacidade + sem token/conta).
      # Excludes de node_modules/dist/etc. vêm de .semgrepignore na raiz.
      - name: SAST (semgrep — TS/JS/React + OWASP)
        run: |
          docker run --rm -v "$PWD:/src" -w /src \
            semgrep/semgrep@sha256:2b33f46ba66cf8cc2ad59ccfa7d22951fd00c632c38f1339e84ec8e6e641a942 \
            semgrep scan \
              --config=p/typescript \
              --config=p/react \
              --config=p/owasp-top-ten \
              --error \
              --metrics=off \
              apps/web

  # Gate de LAYOUT do frontend (dívida de 360px, 2026-08-10). Este repositório NÃO tinha nenhum
  # job de frontend: `vitest` nunca rodou no CI e nenhuma medição de tela era exigida em PR — foi
  # assim que seis telas mergearam com "validação em ~360px não foi feita" e três PRs de correção
  # em campo foram pagos (#56, #58, #89).
  #
  # Percorreu o MESMO caminho de `secret-scan`/`sast-semgrep` — observável primeiro, bloqueante
  # depois (ver cabeçalho) — e a promoção JÁ ACONTECEU: `frontend` é required check em `main`,
  # verificado em 2026-08-18. A régua agora mede E barra. Foi a ausência de barreira, não a de
  # conhecimento, que deixou seis telas passarem; é essa repetição que a barreira hoje impede.
  # NÃO usamos `continue-on-error` (deixaria o check sempre verde e tornaria a promoção via
  # branch protection um no-op).
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4

      # SEM `version:` de propósito. A raiz já declara `"packageManager": "pnpm@9.12.0"`, e
      # `pnpm/action-setup@v4` FALHA quando as duas fontes existem ("Multiple versions of pnpm
      # specified"). O `packageManager` é a fonte melhor: pina a versão exata e é a mesma que a
      # máquina de quem desenvolve usa.
      - uses: pnpm/action-setup@v4

      # ⚠️ NÃO baixe daqui sem medir. A raiz declara `"engines": {"node": ">=22"}` e este job
      # nasceu pinado em 20 — abaixo do piso. O sintoma não foi um erro de engine: foi
      # `shareInbox.test.ts` ficando VERMELHO só no CI e verde em toda máquina de dev. Aquele
      # teste depende de `structuredClone` preservar `File` (ver o comentário no topo dele), e
      # esse comportamento MUDA entre versões do Node. 24 é a versão que quem desenvolve usa e na
      # qual o comportamento foi verificado.
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: pnpm

      # Na raiz: é um workspace pnpm, o lockfile é de lá.
      - name: Instalar dependências
        run: pnpm install --frozen-lockfile
        working-directory: .

      # O `eslint` não rodava em NENHUM job, e foi por essa fresta que um NBSP literal em
      # `investimentos.test.ts` deixou `pnpm lint` vermelho em `main` do PR #102 até 12/08 sem
      # nada protestar. Vem antes do typecheck de propósito: é a etapa mais rápida das quatro.
      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Testes de unidade (vitest)
        run: pnpm test

      # Só chromium: o gate mede geometria de layout, não compatibilidade entre motores.
      # `--with-deps` instala as bibliotecas de sistema que o runner não traz.
      - name: Instalar chromium do Playwright
        run: pnpm exec playwright install --with-deps chromium

      - name: Gate de layout em 360px
        run: pnpm e2e

      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: apps/web/playwright-report/
          retention-days: 7
