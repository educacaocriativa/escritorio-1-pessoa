# Teste de MUTAÇÃO do frontend (Stryker) — a categoria de verificação que faltava (issue #121).
#
# Na PR #119 o QA achou NOVE defeitos com a suíte 100% verde: 693 testes, 32 medições de 360px,
# `tsc` e `eslint` limpos. Quem os achou foi mutação MANUAL — desfazer uma linha da produção e ver
# se algum teste morre. O CLAUDE.md registra "provado por mutação" em pelo menos cinco lugares (o
# `>` vs `>=` do `posted_at` que sobreviveu a 58 testes verdes, o `begin_nested()` do ledger de IA,
# o `_proximo_marco` da Vima, a troca de cores origem × tag do Kanban, os 5 de 5 do `grade.ts`).
# Ou seja: a prática existia e dependia de alguém LEMBRAR. Este workflow é o fim dessa dependência.
#
# ── POR QUE UM ARQUIVO NOVO, E NÃO UM JOB EM `ci.yml` ────────────────────────────────────────────
# O `ci.yml` dispara em `push`/`pull_request`. Acrescentar `schedule` no `on:` DELE faria os cinco
# jobs existentes rodarem toda noite também — build de imagem Docker, testcontainers, gitleaks,
# semgrep, Playwright — ou obrigaria um `if: github.event_name != 'schedule'` em cada um deles, uma
# guarda por job que alguém esquece de repetir no sexto. Gatilho diferente, arquivo diferente: o
# `on:` daqui diz a verdade inteira sobre quando este trabalho roda.
#
# ── POR QUE NOTURNO, E NUNCA POR PR ──────────────────────────────────────────────────────────────
# Medido de verdade (2026-08-18, máquina de 12 vCPU, em quatro lotes): ~21 minutos para os 25
# módulos, 1.605 mutantes. O runner do GitHub tem 2 vCPU — o número lá é maior, e por isso o
# `timeout-minutes` abaixo é generoso.
#
# Pendurar isso em toda PR trocaria um gate AUSENTE por um gate que todo mundo aprende a ignorar:
# meia hora de espera por PR vira "sobe assim mesmo" na segunda semana, e um check que se aprende a
# ignorar é pior que nenhum, porque dá a sensação de cobertura. Mutação é diagnóstico periódico da
# QUALIDADE DA SUÍTE, não portaria de mudança — a suíte não muda de qualidade entre duas PRs de
# terça-feira. O gate de PR continua sendo o job `frontend` do `ci.yml`.
#
# ── MEDE ANTES, BARRA DEPOIS — E JÁ BARRA ────────────────────────────────────────────────────────
# Este job nasceu SEM limiar de reprovação, de propósito: limiar escrito antes da primeira medição é
# número sem evidência (Artigo IV da Constitution, "No Invention"). O período de observação acabou.
# Hoje `stryker.config.mjs` traz `thresholds.break: 80` (issue #189), derivado do baseline MEDIDO de
# 83,52% — a aritmética inteira do "por que 80" está no comentário daquele campo. Mesmo caminho que
# `secret-scan`, `sast-semgrep` e `frontend` já percorreram no `ci.yml`: mede antes, barra depois.
#
# ── E O QUE BARRA A MEDIÇÃO QUE NÃO VALE (issue #213) ────────────────────────────────────────────
# Um limiar de score só significa alguma coisa se o score for confiável, e ele NÃO é em máquina
# carregada: no Stryker `Timeout` conta como MORTO, então cada mutante que estoura o relógio por
# contenção de CPU — e não por ter entrado em laço — é creditado como se um teste o tivesse pego. A
# régua fica otimista exatamente quando o ambiente está pior. Medido no #213: 12 timeouts em
# `contas.ts` numa máquina com 10 worktrees ativas, contra 0 na CI, e o módulo mediu ~3,8 pontos a
# mais do que a verdade.
#
# O passo `Guarda de timeouts` no fim deste job é quem cobra isso, e por isso este workflow declara:
# **a corrida só vale em máquina dedicada**. É o que o `concurrency:` abaixo já garante para o
# runner, e o que o `scripts/gates.sh` pede a quem roda local.
name: Mutation (noturno)

on:
  # 06:00 UTC = 03:00 em America/Sao_Paulo (o fuso em que o e1p vive — CLAUDE.md). O cron do
  # GitHub Actions é SEMPRE em UTC e não tem horário de verão: no verão do hemisfério norte este
  # horário anda uma hora no relógio de Brasília, e tudo bem — o que importa é ser madrugada.
  #
  # ⚠️ Duas regras do GitHub que já surpreenderam gente neste tipo de workflow:
  #  1. `schedule` só dispara na branch PADRÃO. Este arquivo não roda enquanto viver numa branch
  #     de feature — o `workflow_dispatch` abaixo é como se testa antes do merge.
  #  2. O agendamento é DESLIGADO automaticamente após 60 dias sem commit no repositório, com um
  #     e-mail para quem pode reativar. Se o relatório sumir por semanas, é o primeiro lugar a olhar.
  schedule:
    - cron: "0 6 * * *"

  # Execução sob demanda: antes de um merge grande, ou para conferir uma triagem de sobreviventes
  # sem esperar a madrugada.
  workflow_dispatch:

# Uma corrida por vez. Duas corridas simultâneas disputariam os mesmos vCPU do runner e a segunda
# mediria contenção de CPU, não qualidade de teste — e é assim que "timeout" vira falso positivo.
concurrency:
  group: mutation-${{ github.ref }}
  cancel-in-progress: false

jobs:
  mutation:
    runs-on: ubuntu-latest
    # ~21 min em 12 vCPU; o runner tem 2. O teto existe para não queimar horas num laço infinito
    # que escapou do `timeoutMS` do Stryker, não para apertar a medição.
    timeout-minutes: 120

    # ── PERMISSOES, NO NIVEL DO JOB ─────────────────────────────────────────────────────────────
    # O default deste repositorio da ao GITHUB_TOKEN apenas `contents/metadata/packages: read` — o
    # proprio log de execucao imprime isso no grupo "GITHUB_TOKEN Permissions". Os dois passos de
    # relatorio abaixo precisam de mais:
    #
    #   actions: read  -> baixar o `mutation-report` da corrida ANTERIOR (a tendencia depende dele)
    #   issues: write  -> abrir/comentar o aviso quando o score cai
    #
    # Declarar o bloco inteiro e obrigatorio: assim que `permissions:` existe, o que nao esta
    # listado passa a ser `none` — por isso `contents: read` aparece aqui, mesmo sendo default.
    permissions:
      contents: read
      actions: read
      issues: write

    # ── FUSO, NO NIVEL DO JOB (issue #169) ──────────────────────────────────────────────────────
    # O runner do GitHub roda em UTC. Este job abortou nas suas DUAS unicas execucoes (19 e
    # 20/08/2026), sempre no dry run do Stryker, e sempre com a mesma notícia:
    #
    #     expected '2026-10-11' to be '2026-10-10' // Object.is equality
    #
    # A asserção é de `src/features/agenda/grade.test.ts:468`, e ela esta CERTA: o proprio
    # comentario dela nomeia a dependencia ("o TZ que a suite fixa"). O defeito era o ambiente
    # deste job, nao o teste.
    #
    # ⚠️ E por que o `env: { TZ }` do `vitest.config.ts` nao bastava — isto foi MEDIDO em
    # 20/08/2026 (vitest 2.1.9, Node 24, maquina forcada para `TZ=UTC`), nao inferido:
    #
    #     pool                | `grade.test.ts`
    #     --------------------|----------------
    #     default (`forks`)   | 40 passed
    #     `threads`           | 1 failed  <-- o que o Stryker monta
    #
    # `@stryker-mutator/vitest-runner` FORCA `pool: 'threads'` para rodar com um worker so
    # (`dist/src/vitest-test-runner.js`, `#getVitestPoolConfig`). E o `env` do vitest so troca o
    # fuso de verdade quando ele nasce COM o processo — o que o pool `forks` faz e o `threads` nao
    # tem como fazer: uma thread nasce dentro de um processo que ja escolheu seu fuso, e escrever
    # em `process.env` depois nao reabre essa escolha. Medido dentro da thread: `process.env.TZ`
    # dizia "America/Sao_Paulo" e o relogio dizia UTC. O env CHEGA — chega tarde.
    #
    # Fixar aqui resolve na raiz: a variavel existe ANTES de o Node comecar, entao vale para
    # qualquer pool, qualquer runner e qualquer runner de teste futuro.
    #
    # ⚠️ No JOB, e nao num `step`: os DOIS passos que rodam teste dependem disto — `pnpm test` e
    # `pnpm mutation` — e uma variavel por step e exatamente a guarda que alguem esquece de
    # repetir no terceiro. E nao no topo do arquivo (nivel de workflow) porque o alcance certo e
    # este job: um segundo job futuro (publicar relatorio, abrir issue de sobreviventes) nao
    # deve herdar em silencio um fuso que nao lhe diz respeito.
    #
    # America/Sao_Paulo, e nao UTC, porque e o fuso em que o e1p vive (CLAUDE.md) e o que a suite
    # ja exige. Reproduzir aqui o ambiente da suite e o ponto.
    env:
      TZ: America/Sao_Paulo

    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4

      # SEM `version:`, igual ao job `frontend` do ci.yml: a raiz já declara
      # `"packageManager": "pnpm@9.12.0"` e `pnpm/action-setup@v4` FALHA quando as duas fontes
      # existem ("Multiple versions of pnpm specified").
      - uses: pnpm/action-setup@v4

      # Node 24 pela MESMA razão escrita no job `frontend`, e ela vale em dobro aqui: o baseline do
      # CLAUDE.md §5.3 foi medido em 24, e `src/lib/shareInbox.test.ts` depende de
      # `structuredClone` preservar `File` — comportamento que MUDA entre versões do Node. Num Node
      # diferente aquele arquivo fica vermelho, a corrida inteira aborta na dry run e o relatório
      # não sai. Mudar este número exige remedir o baseline.
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: pnpm

      # Na raiz: é um workspace pnpm, o lockfile é de lá.
      - name: Instalar dependências
        run: pnpm install --frozen-lockfile
        working-directory: .

      # A dry run do Stryker roda a suíte sem mutação nenhuma. Se ela já estiver vermelha, a
      # corrida aborta com um erro de dentro do Stryker, e quem lê o log noturno gasta tempo
      # procurando problema de mutação onde há problema de teste. Rodar o vitest antes separa as
      # duas notícias, e custa ~15s.
      - name: Testes de unidade (a suíte tem de estar verde ANTES de mutar)
        run: pnpm test

      - name: Teste de mutação (Stryker)
        run: pnpm mutation

      # ── A TENDENCIA: baixar a medicao ANTERIOR ────────────────────────────────────────────────
      # O `mutation.json` guarda mutantes, nao historico. Para dizer "caiu 1,4 desde ontem" e
      # preciso o relatorio da corrida passada, e o unico lugar onde ele existe e o artefato dela.
      #
      # Procura a corrida COMPLETA mais recente que nao seja esta — deliberadamente sem filtrar por
      # `--status success`: uma corrida reprovada pelo `thresholds.break` mediu, e o numero dela e
      # justamente o que se quer comparar. Ignorar as reprovadas compararia hoje com a ultima noite
      # BOA e reportaria a queda inteira de novo, toda noite, ate alguem consertar.
      #
      # `continue-on-error` e a parte importante: sem relatorio anterior o resumo ainda sai, so que
      # sem delta. Tendencia indisponivel nao pode derrubar a medicao.
      - name: Relatório da corrida anterior (para a tendência)
        if: always()
        continue-on-error: true
        working-directory: .
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for id in $(gh run list --workflow=mutation.yml --status=completed --limit=8 \
                        --json databaseId --jq '.[].databaseId'); do
            [ "$id" = "$GITHUB_RUN_ID" ] && continue
            if gh run download "$id" -n mutation-report -D anterior 2>/dev/null; then
              echo "RUN_ANTERIOR=$id" >> "$GITHUB_ENV"
              echo "Comparando com a corrida $id."
              exit 0
            fi
          done
          echo "Nenhuma corrida anterior com relatório — o resumo sai sem delta."

      # ── O RESUMO NA PAGINA DA CORRIDA ─────────────────────────────────────────────────────────
      # `$GITHUB_STEP_SUMMARY` renderiza markdown na propria pagina do run. E o conserto do que
      # tornava a noite verde SILENCIOSA: antes disto o score so existia dentro do log e de um
      # artefato de 990 KB, entao ninguem via 83,52 virar 81,2 — a primeira noticia seria o build
      # quebrando no dia em que cruzasse o `break`.
      - name: Resumo do score na página da corrida
        id: resumo
        if: always()
        working-directory: .
        run: |
          node scripts/resumo-mutacao.mjs \
            apps/web/reports/mutation/mutation.json \
            anterior/mutation.json >> "$GITHUB_STEP_SUMMARY"
          if [ -n "${RUN_ANTERIOR:-}" ]; then
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "_Comparado com a corrida [\`$RUN_ANTERIOR\`](${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${RUN_ANTERIOR})._" >> "$GITHUB_STEP_SUMMARY"
          fi
          cat "$GITHUB_STEP_SUMMARY"

      # `if: always()` — o relatório é o PRODUTO deste job, não um anexo de falha. É o oposto do
      # `playwright-report` do ci.yml (`if: failure()`), e de propósito: lá o artefato serve para
      # explicar um vermelho; aqui ele é a razão de o job existir. Numa corrida interrompida, o
      # parcial ainda diz o que foi medido até parar.
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mutation-report
          path: apps/web/reports/mutation/
          # 30 dias, contra os 7 do playwright-report: este roda uma vez por dia, e comparar o
          # score de hoje com o de três semanas atrás é justamente o uso que justifica guardá-lo.
          retention-days: 30

      # ── O AVISO — a unica parte que CHEGA ATE ALGUEM ──────────────────────────────────────────
      # O resumo acima resolve "onde eu vejo o numero", nao "como eu fico sabendo". Corrida verde
      # nao notifica ninguem: o GitHub so manda e-mail de `schedule` quando o job FALHA. Sem este
      # passo, uma queda de 83,5 para 80,4 ao longo de semanas seria invisivel ate cruzar o
      # `break`, e a primeira noticia seria a reprovacao — tarde demais para ser tendencia.
      #
      # Abrir/comentar uma issue e o unico canal de PUSH disponivel para um job que passou. A outra
      # opcao seria reprovar o job na queda, e ela foi rejeitada: misturaria "a suite piorou um
      # pouco" com "a suite esta abaixo do minimo", que sao decisoes diferentes e ja tem donos
      # diferentes (este aviso e o `thresholds.break`).
      #
      # A condicao vem do script (`alerta`), que so diz `true` numa QUEDA de >= 1,0 ponto contra a
      # corrida anterior — evento, nao estado. O porque de nao ser estado esta no cabecalho do
      # `scripts/resumo-mutacao.mjs`.
      #
      # `continue-on-error`: falha ao abrir issue nao pode reprovar uma medicao que deu certo.
      - name: Avisar quando o score cair
        if: always() && steps.resumo.outputs.alerta == 'true'
        continue-on-error: true
        working-directory: .
        env:
          GH_TOKEN: ${{ github.token }}
          SCORE: ${{ steps.resumo.outputs.score }}
          DELTA: ${{ steps.resumo.outputs.delta }}
        run: |
          set -euo pipefail
          CORRIDA="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          CORPO="O mutation score caiu **${DELTA} ponto(s)**, para **${SCORE}%**.

          O resumo da corrida — incluindo **quais módulos pioraram** e se algum módulo novo entrou pelo escopo descoberto — está na página do run: ${CORRIDA}

          Queda não é reprovação: o \`thresholds.break\` segue sendo o piso, e o job passou. Isto é o aviso de TENDÊNCIA, que existe porque noite verde não notifica ninguém.

          Antes de procurar teste que piorou, descarte a causa mais comum: **módulo novo no escopo**. O \`stryker.config.mjs\` descobre todo \`.ts\` com teste irmão, então um módulo recém-testado entra sozinho e derruba o total sem que nenhum teste existente tenha regredido — o resumo do run diz se foi isso."

          # A label serve de chave de deduplicacao: um aviso aberto recebe COMENTARIO, nao uma
          # segunda issue. Sem isto, uma queda em tres noites seguidas viraria tres issues.
          gh label create mutacao-tendencia --color FBCA04 \
            --description "Aviso automático de queda no mutation score" 2>/dev/null || true

          ABERTA=$(gh issue list --label mutacao-tendencia --state open \
                     --json number --jq '.[0].number // empty')

          if [ -n "$ABERTA" ]; then
            gh issue comment "$ABERTA" --body "$CORPO"
            echo "Comentado na issue #$ABERTA."
          else
            gh issue create --label mutacao-tendencia \
              --title "Mutation score caiu ${DELTA} ponto(s), para ${SCORE}%"               --body "$CORPO"
          fi

      # ── A GUARDA DE TIMEOUTS — O SINTOMA VIRA SINAL (issue #213) ──────────────────────────────
      # `Timeout` conta como MORTO no score do Stryker, e isso não é opção: a soma está em
      # `mutation-testing-metrics`, `totalDetected = timeout + killed`. Numa máquina disputada, o
      # mutante estoura o relógio por contenção de CPU e é creditado como se um teste o tivesse
      # pego — a régua mente A FAVOR justamente quando o ambiente está pior. O raciocínio completo,
      # a medição de campo e a origem do limiar 5 estão no cabeçalho do script.
      #
      # ⚠️ POR ÚLTIMO, e de propósito: se esta guarda reprovar, o resumo já foi para a página da
      # corrida e o `mutation-report` já subiu como artefato. A evidência de uma medição recusada é
      # exatamente o que alguém vai querer ler — reprovar antes de publicá-la deixaria o job
      # vermelho sem material para investigar.
      #
      # `if: always()` porque o caso interessante inclui a corrida que o `thresholds.break` já
      # reprovou: saber que AQUELE número também estava inflado por timeout muda o diagnóstico.
      - name: Guarda de timeouts (a corrida só vale em máquina dedicada)
        if: always()
        working-directory: .
        run: |
          set -o pipefail
          echo '### Guarda de timeouts' >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          # `|| rc=$?` e NAO `rc=$?` na linha seguinte: o Actions roda `run:` sob `bash -e`, e
          # ali um pipeline que falha ABORTA o passo antes da proxima linha. Medido: a cerca de
          # codigo ficava ABERTA e engolia o resto do summary; o guarda reprovava certo, e o
          # relatorio dele saia ilegivel. Dentro de uma lista `||` o `-e` nao dispara.
          rc=0
          node scripts/guarda-timeouts-mutacao.mjs \
            apps/web/reports/mutation/mutation.json | tee -a "$GITHUB_STEP_SUMMARY" || rc=$?
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          exit "$rc"
