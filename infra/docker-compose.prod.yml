# Deploy em VPS único (ex.: Hostinger KVM) — ver docs/HOSTINGER-DEPLOY.md.
# Diferenças do docker-compose.yml (dev): sem portas de Postgres/API expostas ao host,
# segredos via .env.prod (nunca hardcoded), RLS role criada via env (initdb-prod),
# reverse proxy Caddy na frente com TLS automático (Let's Encrypt).
services:
  postgres:
    image: postgres:16-alpine
    restart: always
    environment:
      POSTGRES_DB: e1pdb
      POSTGRES_USER: e1p_root
      POSTGRES_PASSWORD: ${POSTGRES_ROOT_PASSWORD:?defina no .env.prod}
      APP_DB_PASSWORD: ${APP_DB_PASSWORD:?defina no .env.prod}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/initdb-prod:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U e1p_root -d e1pdb"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks: [internal]

  redis:
    image: redis:7-alpine
    restart: always
    mem_limit: 128m
    command: redis-server --maxmemory 96mb --maxmemory-policy allkeys-lru
    volumes:
      - evolution_redis_data:/data
    networks: [internal]

  evolution:
    # WhatsApp por Evolution API (Baileys, não-oficial) — transporte alternativo ao Meta Cloud
    # API. SEM `ports:` — nada publicado, nada no Caddy/Traefik. mem_limit RÍGIDO: se uma sessão
    # Baileys inchar, o OOM killer mata a Evolution, não o Postgres. Versão FIXADA, nunca `:latest`.
    image: evoapicloud/evolution-api:v2.3.7
    restart: always
    mem_limit: 1g
    environment:
      AUTHENTICATION_API_KEY: ${EVOLUTION_API_KEY:?defina no .env.prod}
      DATABASE_PROVIDER: postgresql
      DATABASE_CONNECTION_URI: postgresql://e1p_evolution:${EVOLUTION_DB_PASSWORD:?defina no .env.prod}@postgres:5432/evolution_db
      REDIS_URI: redis://redis:6379/0
      DEL_INSTANCE: 'false'
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    volumes:
      - evolution_instances:/evolution/instances
    networks: [internal]

  api:
    build: ../apps/api
    restart: always
    env_file:
      - .env.prod
    environment:
      # App conecta como papel NÃO-superusuário (Regra de Ouro nº 1 — ver CLAUDE.md).
      DATABASE_URL: postgresql+psycopg://e1p_app:${APP_DB_PASSWORD}@postgres:5432/e1pdb
      ENVIRONMENT: production
    volumes:
      - uploads_data:/app/uploads
      - generated_data:/app/generated
    depends_on:
      postgres:
        condition: service_healthy
    command: >
      sh -c "alembic upgrade head &&
             python -m app.seed &&
             python -m app.seed_staging &&
             uvicorn app.main:app --host 0.0.0.0 --port 8000"
    networks: [internal]

  worker:
    # Worker durável (Story 4.3): tick do funil + fila de notificações. Espelha o `api` SEM porta,
    # SEM volumes (não gera/lê arquivos) e SEM alembic/seed (o `api` já migra/semeia). depends_on:
    # api p/ subir só depois das migrations. Só a rede interna — não é HTTP-facing.
    build: ../apps/api
    restart: always
    env_file:
      - .env.prod
    environment:
      DATABASE_URL: postgresql+psycopg://e1p_app:${APP_DB_PASSWORD}@postgres:5432/e1pdb
      ENVIRONMENT: production
    depends_on:
      - api
    command: python -m app.worker
    networks: [internal]

  web:
    build:
      context: ..
      dockerfile: apps/web/Dockerfile
    restart: always
    depends_on:
      - api
    networks: [internal]

  caddy:
    # Imagem custom com o plugin caddy-dns/cloudflare (necessário p/ o desafio DNS-01 do
    # wildcard `*.${ROOT_DOMAIN}` — a imagem oficial `caddy:2-alpine` não traz módulos de
    # DNS). Ver infra/caddy/Dockerfile e Story 4.4. O domínio único (${DOMAIN}) segue no
    # HTTP-01 automático, sem regressão (IV1).
    build: ./caddy
    restart: always
    # env_file: injeta DOMAIN, ROOT_DOMAIN e CLOUDFLARE_API_TOKEN (lidos pelo Caddyfile via
    # {$DOMAIN}/{$ROOT_DOMAIN}/{$CLOUDFLARE_API_TOKEN}). Preencha ROOT_DOMAIN e o token no
    # .env.prod (ver .env.prod.example) — sem o token, o bloco wildcard não emite o cert.
    env_file:
      - .env.prod
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - api
      - web
    networks: [internal]

networks:
  internal:

volumes:
  postgres_data:
  uploads_data:
  generated_data:
  caddy_data:
  caddy_config:
  evolution_instances:
  evolution_redis_data:
