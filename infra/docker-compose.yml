# Ambiente de desenvolvimento local. Em produção, ver docs/AWS-DEPLOYMENT.md.
services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: e1pdb
      POSTGRES_USER: e1puser
      POSTGRES_PASSWORD: e1ppass
    ports:
      # Porta do HOST remapeada pra 5433: 5432 colide com axisgov-postgres (outro projeto local).
      # Comunicação api/worker -> postgres usa o nome interno do Docker ("postgres:5432"), não
      # esta porta — só afeta acesso direto do host (psql/pgAdmin), que agora é em localhost:5433.
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      # Demove o usuário da app a NÃO-superusuário p/ que a RLS valha (ver script).
      # DESATIVADO: bind mount de caminho em SSD externo com espaço ("Extreme SSD") quebra o
      # file-sharing do Docker Desktop no macOS (mkdir /host_mnt/Volumes/Extreme SSD: file exists).
      # O script initdb só roda no PRIMEIRO boot (data dir vazio); o papel e1p_app já está no volume.
      # Para reabilitar num setup limpo (ou em caminho sem espaço), descomente a linha abaixo.
      # - ./docker/initdb:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U e1puser -d e1pdb"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    # Exclusivo da Evolution API (sessões Baileys) — o worker do e1p continua fazendo polling
    # no Postgres, não ganha dependência nova. Ver docs/superpowers/specs/
    # 2026-07-30-whatsapp-evolution-multi-tenant-design.md §8.
    image: redis:7-alpine
    restart: unless-stopped
    mem_limit: 128m
    command: redis-server --maxmemory 96mb --maxmemory-policy allkeys-lru
    volumes:
      - evolution_redis_data:/data

  evolution:
    # WhatsApp por Evolution API (Baileys, não-oficial) — transporte alternativo ao Meta Cloud
    # API. SEM `ports:` — nada publicado, nada no Traefik (o manager web da Evolution não existe
    # pra fora). mem_limit RÍGIDO: se uma sessão Baileys inchar, o OOM killer mata a Evolution,
    # não o Postgres (o WhatsApp cai, o produto continua de pé). Versão FIXADA, nunca `:latest`.
    image: evoapicloud/evolution-api:v2.3.7
    restart: unless-stopped
    mem_limit: 1g
    environment:
      AUTHENTICATION_API_KEY: ${EVOLUTION_API_KEY:-dev-evolution-key-troque-em-producao}
      DATABASE_PROVIDER: postgresql
      # Role e banco PRÓPRIOS (e1p_evolution/evolution_db) — a Evolution é software de
      # terceiro rodando ao lado do banco do e1p; não tem por que enxergar tabelas com RLS.
      # ATENÇÃO: este role/banco NÃO são criados automaticamente (mesma situação do e1p_app —
      # ver CLAUDE.md §9). Antes de subir este serviço de verdade, criar manualmente uma vez:
      #   docker exec infra-postgres-1 psql -U e1puser -d e1pdb -c \
      #     "CREATE ROLE e1p_evolution WITH LOGIN PASSWORD 'e1p-evolution-pass'; \
      #      CREATE DATABASE evolution_db OWNER e1p_evolution;"
      # Validação end-to-end da Evolution (Onda 1) fica para o checklist manual, na VPS.
      DATABASE_CONNECTION_URI: postgresql://e1p_evolution:e1p-evolution-pass@postgres:5432/evolution_db
      REDIS_URI: redis://redis:6379/0
      DEL_INSTANCE: 'false'
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    volumes:
      - evolution_instances:/evolution/instances

  api:
    build: ../apps/api
    restart: unless-stopped
    # env_file (não `environment: ${VAR}`) porque lê o arquivo CRU, sem interpolação — algumas
    # credenciais reais (ex.: API key da Asaas) contêm `$` literal, que o Compose tentaria
    # expandir como referência de variável se passasse por `${VAR:-}` (vira string vazia).
    env_file:
      - path: ../.env
        required: false
    environment:
      # App conecta como papel NÃO-superusuário (e1p_app) p/ a RLS valer. Ver initdb/01-rls-enforce.sql.
      DATABASE_URL: postgresql+psycopg://e1p_app:e1ppass@postgres:5432/e1pdb
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      JWT_SECRET: ${JWT_SECRET:-dev-secret-change-me}
      ENVIRONMENT: development
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
    # Roda migrations e sobe a API.
    command: >
      sh -c "alembic upgrade head &&
             python -m app.seed &&
             uvicorn app.main:app --host 0.0.0.0 --port 8000"

  worker:
    # Worker durável (Story 4.3): tick do funil + fila de notificações. Mesmo bloco do `api`,
    # SEM porta HTTP e SEM alembic/seed (o `api` já migra/semeia). depends_on: api p/ subir só
    # depois das migrations (evita corrida com o schema).
    build: ../apps/api
    restart: unless-stopped
    env_file:
      - path: ../.env
        required: false
    environment:
      DATABASE_URL: postgresql+psycopg://e1p_app:e1ppass@postgres:5432/e1pdb
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      JWT_SECRET: ${JWT_SECRET:-dev-secret-change-me}
      ENVIRONMENT: development
    depends_on:
      - api
    command: python -m app.worker

  web:
    # Contexto = raiz do monorepo (o Dockerfile precisa de packages/ e pnpm-workspace.yaml).
    # Build de PRODUÇÃO (nginx estático, SEM proxy /api). Em DEV o front é o Vite (`pnpm dev`)
    # na 5173, que faz proxy /api -> :8000. Por isso este container NÃO usa a 5173: senão ele
    # roubaria a porta do Vite ao subir e a app "cairia" (chamadas /api voltariam como HTML).
    # Acesse o build de produção em http://localhost:8081 quando quiser testá-lo.
    build:
      context: ..
      dockerfile: apps/web/Dockerfile
    restart: unless-stopped
    ports:
      - "8081:80"
    depends_on:
      - api

volumes:
  postgres_data:
  evolution_instances:
  evolution_redis_data:
